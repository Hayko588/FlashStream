services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres/init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - "127.0.0.1:${KAFKA_HOST_PORT:-9092}:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  kafka-init:
    image: apache/kafka:3.9.0
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic inventory-reservation-requests --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic inventory-reservation-results --partitions 3 --replication-factor 1
    depends_on:
      kafka:
        condition: service_healthy

  catalog:
    build:
      context: .
      dockerfile: FlashStream.Catalog/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Catalog: Host=postgres;Port=5432;Database=flashstream_catalog;Username=${POSTGRES_USER:?Set POSTGRES_USER};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${CATALOG_HOST_PORT:-8081}:8080"

  ordering:
    build:
      context: .
      dockerfile: FlashStream.Ordering/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Ordering: Host=postgres;Port=5432;Database=flashstream_ordering;Username=${POSTGRES_USER:?Set POSTGRES_USER};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      Services__CatalogBaseUrl: http://catalog:8080/
      Kafka__BootstrapServers: kafka:9092
      Kafka__InventoryReservationRequestsTopic: inventory-reservation-requests
      Kafka__InventoryReservationResultsTopic: inventory-reservation-results
      Kafka__OrderingConsumerGroup: flashstream-ordering
      Order__MaximumQuantity: ${ORDER_MAXIMUM_QUANTITY:-100}
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      catalog:
        condition: service_started
    ports:
      - "127.0.0.1:${ORDERING_HOST_PORT:-8080}:8080"

  inventory:
    build:
      context: .
      dockerfile: FlashStream.Inventory/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Inventory: Host=postgres;Port=5432;Database=flashstream_inventory;Username=${POSTGRES_USER:?Set POSTGRES_USER};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      Kafka__BootstrapServers: kafka:9092
      Kafka__InventoryReservationRequestsTopic: inventory-reservation-requests
      Kafka__InventoryReservationResultsTopic: inventory-reservation-results
      Kafka__InventoryConsumerGroup: flashstream-inventory
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${INVENTORY_HOST_PORT:-8082}:8080"

  web:
    build:
      context: .
      dockerfile: FlashStream.Web/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Order__MaximumQuantity: ${ORDER_MAXIMUM_QUANTITY:-100}
      Services__CatalogBaseUrl: http://catalog:8080/
      Services__OrderingBaseUrl: http://ordering:8080/
      Services__InventoryBaseUrl: http://inventory:8080/
    depends_on:
      catalog:
        condition: service_started
      ordering:
        condition: service_started
      inventory:
        condition: service_started
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-8083}:8080"

volumes:
  postgres-data:
  kafka-data:
